cloud:
  aws:
    s3:
      bucket: test-bucket/test
    region:
      static: ap-northeast-2
      auto: false
    stack:
      auto: false

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/test?reWriteBatchedInserts=true
    username: test
    password: testtest
    driver-class-name: org.postgresql.Driver
    hikari:
      data-source-properties:
        reWriteBatchedInserts: true
      auto-commit: false
  jpa:
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          batch_size: 100
        order_inserts: true

    hibernate:
      ddl-auto: update
    defer-datasource-initialization: true # 데이터베이스 생성 지연으로 스크립트 실행 가능
  sql:
    init:
      mode: always